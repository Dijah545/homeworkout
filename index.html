<html lang="en">

<div id="app" class="app-shell">
  <header class="topbar">

      <img src="assets/icon-192.png" alt="Home Workout logo">
      <div>
        <strong>Home Workout</strong>
        <span>Your Fitness. Your Home. Your Power.</span>

  <main id="view"></main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-route="today" class="nav-item active"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/></svg></span><small>Today</small></button>
    <button data-route="week" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span><small>Week</small></button>
    <button data-route="library" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8v8M17 8v8M4 10v4M20 10v4M7 12h10"/><path d="M2 9v6M22 9v6"/></svg></span><small>Library</small></button>
    <button data-route="history" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="m7 15 4-4 3 3 5-7"/></svg></span><small>History</small></button>
    <button data-route="body" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M7 20h10M5 7h14"/><path d="m5 7-3 6h6L5 7Zm14 0-3 6h6l-3-6Z"/></svg></span><small>Body</small></button>
    <button data-route="settings" class="nav-item"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.4.25.75.6 1 1 .2.3.35.7.4 1.1h.1v4h-.1c-.05.4-.2.8-.4 1.1Z"/></svg></span><small>Settings</small></button>
  </nav>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js?v=87.1"></script>

<script>

  window.addEventListener("load",()=>{

      .catch(()=>{});
  });
}
</script>

</body>
