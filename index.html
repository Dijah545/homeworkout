<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061b30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Home Workout</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=70">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Home Workout build v70 missing image batch 1 CSS -->
</head>
<body>
<div id="app" class="app-shell">
  <header class="topbar">
    <div class="brand">
      <img src="assets/icon-192.png" alt="Home Workout logo">
      <div>
        <strong>Home Workout</strong>
        <span>Your Fitness. Your Home. Your Power.</span>
      </div>
    </div>
    <button class="icon-button" id="themeQuick" aria-label="Toggle theme">◐</button>
  </header>

  <main id="view"></main>

  <nav class="bottom-nav" aria-label="Primary navigation">
    <button data-route="today" class="nav-item active"><span>⌂</span><small>Today</small></button>
    <button data-route="week" class="nav-item"><span>▦</span><small>Week</small></button>
    <button data-route="library" class="nav-item"><span>▤</span><small>Library</small></button>
    <button data-route="history" class="nav-item"><span>◷</span><small>History</small></button>
    <button data-route="body" class="nav-item"><span>⌁</span><small>Body</small></button>
    <button data-route="settings" class="nav-item"><span>⚙</span><small>Settings</small></button>
  </nav>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden"></div>
<script src="app.js?v=70"></script>

<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js?v=70",{updateViaCache:"none"})
      .then(reg=>reg.update())
      .catch(()=>{});
  });
}
</script>

</body>
</html>
